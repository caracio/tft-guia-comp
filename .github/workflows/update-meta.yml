name: update-meta

on:
  schedule:
    - cron: "0 9 * * *"        # 09:00 UTC = 06:00 em Brasília, uma vez por dia
  workflow_dispatch:            # botão "Run workflow" para testar ou reativar

permissions:
  contents: write

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Puxar top comps do MetaTFT
        run: python scraper/fetch_meta.py --out data/comps.json

      - name: Atualizar manifesto e imagens (assets/)
        run: python scraper/fetch_assets.py --download

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comps.json assets/
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "data: atualiza meta TFT ($(date -u +%Y-%m-%d))"
            git push
          fi
